name: Upstream Character Brain Integration
on:
  push:
  pull_request:
jobs:
  upstream-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: vendor/wRITE
      - name: Capability bridge and Native Loop smoke
        run: node --test tests/brain-upstream-smoke.test.mjs tests/brain-native-upstream.test.mjs
        env:
          WRITE_ROOT: ${{ github.workspace }}/vendor/wRITE
