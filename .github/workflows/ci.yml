name: Rebuild CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Bounded durable multi-world crash stress
        run: npm run stress
        env:
          BEIKA_STRESS_TICKS: '400'
